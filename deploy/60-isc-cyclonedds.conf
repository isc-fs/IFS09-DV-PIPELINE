# 60-isc-cyclonedds.conf — installed to /etc/sysctl.d/ by install_cyclonedds_tuning.sh
# (issue #21, docs/DDS_TUNING.md).
#
# Raises the CEILING on how large a socket receive buffer a process may request
# (default 212992 bytes). It does not change any socket by itself: only programs that ask
# for a bigger buffer get one (Cyclone DDS asks for 10 MB via /etc/dv/cyclonedds.xml).
# 32 MB leaves headroom over the 10 MB request.
net.core.rmem_max = 33554432
